<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="No matter what adventure you're aiming for,
    Rainy Days guarantees a dry experience with our waterproof jackets."
    />
    <title>Rainy Days | Home</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <nav class="navigation-rest">
        <a href="index.html"
          ><img
            src="images/rainy-days-logo.png"
            alt="rainy-days-logo"
            class="logo"
        /></a>
        <div class="genders">
          <a href="men.html" class="men">Men</a>
          <a href="women.html" class="women">Women</a>
        </div>
        <div class="navicons">
          <div class="searchfunction">
            <input type="checkbox" id="checkboxsearch" />
            <input type="search" id="searchbox" />
            <label for="checkboxsearch" class="searchicon"
              ><i class="fa-solid fa-magnifying-glass"></i
            ></label>
          </div>
          <a href="favourites.html" class="heart" title="favourites">
            <i class="fa-regular fa-heart"></i>
          </a>
          <a href="cart.html">
            <img
              src="images/shopping-cart.svg"
              alt="Shopping cart"
              class="cart"
            />
          </a>
        </div>
      </nav>
      <div class="breadcrumbs">
        <a href="index.html">Home</a>
        <span>/</span>
        <a href="women.html">Women</a>
      </div>
    </header>
    <main class="checkout-main">
      <div class="checkout-header">
        <h3>Your information</h3>
      </div>
      <div class="your-information">
        <div class="email-information">
          <p>MAIL</p>
          <input type="email" name="email" id="your-info-box" />
        </div>
        <div class="adress-information">
          <p>ADRESS</p>
          <input type="text" name="your-full-name" id="your-info-box" />
          <input type="text" name="street-adress" id="your-info-box" />
          <input type="text" name="city" id="your-info-box" />
        </div>
        <div class="phone-number-information">
          <p>PHONE NUMBER</p>
          <input type="tel" name="phone" id="your-info-box" />
        </div>
      </div>
      <div class="checkout-header">
        <h3>Delivery</h3>
      </div>
      <div class="delivery-container">
        <div class="express-container">
          <p>Express $4.50</p>
          <input
            type="radio"
            name="delivery"
            value="1-2"
            id="delivery-express"
          />
          <label for="delivery-express">1-2 days</label>
        </div>
        <div class="standard-container">
          <p>Standard $0.00</p>
          <input
            type="radio"
            name="delivery"
            value="3-6"
            id="delivery-standard"
          />
          <label for="delivery-express">3-6 days</label>
        </div>
        <div class="from-store-container">
          <p>Bring from store $0.00</p>
          <input
            type="radio"
            name="delivery"
            value="0-2"
            id="delivery-from-store"
          />
          <label for="delivery-from-store">Max 0-2 days</label>
        </div>
      </div>
      <div class="checkout-header">
        <h3>Payment</h3>
      </div>
      <div class="payment-container">
        <a href="order-details.html" class="pay-button">Card</a>
        <a href="order-details.html" class="pay-button">Paypal</a>
        <a href="order-details.html" class="pay-button">Klarna</a>
      </div>
    </main>
    <footer>
      <section class="footer-nav">
        <a href="help.html" class="footer-links">Help</a>
        <a href="shipment.html" class="footer-links">Shipment</a>
        <a href="about-us.html" class="footer-links">About us</a>
        <a href="language.html" class="footer-links">Language</a>
      </section>
    </footer>
  </body>
</html>
