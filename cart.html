<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width initial-scale=1.0" />
    <meta
      name="description"
      content="No matter what adventure you're aiming for, Rainy Days guarantees a dry experience with our waterproof jackets."
    />
    <title>Rainy Days | Home</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <nav class="navigation-rest">
        <a href="index.html"
          ><img
            src="images/rainy-days-logo.png"
            alt="rainy-days-logo"
            class="logo"
        /></a>
        <div class="genders">
          <a href="men.html" class="men">Men</a>
          <a href="women.html" class="women">Women</a>
        </div>
        <div class="navicons">
          <div class="searchfunction">
            <input type="checkbox" id="checkboxsearch" />
            <input type="search" id="searchbox" />
            <label for="checkboxsearch" class="searchicon"
              ><i class="fa-solid fa-magnifying-glass"></i
            ></label>
          </div>
          <a href="favourites.html" class="heart" title="favourites">
            <i class="fa-regular fa-heart"></i>
          </a>
          <a href="cart.html">
            <img
              src="images/shopping-cart.svg"
              alt="Shopping cart"
              class="cart"
            />
          </a>
        </div>
      </nav>
      <div class="breadcrumbs">
        <a href="index.html">Home</a>
        <span>/</span>
        <a href="women.html">Women</a>
      </div>
    </header>
    <main class="main-cart">
      <div class="cart-product">
        <img
          src="images/yellow-hiking.jpg"
          alt="waterproof-jacket"
          class="cart-image"
        />
        <div class="cart-text">
          <p>RAINY DAYS</p>
          <p>Go hiking - Waterproof jacket</p>
        </div>
        <div class="number-price">
          <select name="number" id="number">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
          <p>$197.5</p>
        </div>
        <div class="favourite-remove">
          <i class="fa-regular fa-heart"></i>
          <p>Remove</p>
        </div>
      </div>
      <div class="move-to-checkout">
        <div class="discount-container">
          <label for="discount-code">Do you have any dicount code?</label>
          <div class="disc">
            <input type="text" name="discount-code" id="discount-code" />
            <button class="apply-button">Apply</button>
          </div>
        </div>
        <div class="subtotal">
          <p>Subtotal</p>
          <p>$197.50</p>
        </div>
        <div class="shipping">
          <p>Shipping</p>
          <p>$0.00</p>
        </div>
        <div class="total">
          <p>Total</p>
          <p>$197.50</p>
        </div>
        <a href="checkout.html" class="button-checkout">CHECKOUT</a>
      </div>
    </main>
    <footer>
      <section class="footer-nav">
        <a href="help.html" class="footer-links">Help</a>
        <a href="shipment.html" class="footer-links">Shipment</a>
        <a href="about-us.html" class="footer-links">About us</a>
        <a href="language.html" class="footer-links">Language</a>
      </section>
    </footer>
  </body>
</html>
