<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width initial-scale=1.0" />
    <meta
      name="description"
      content="No matter what adventure you're aiming for, Rainy Days guarantees a dry experience with our waterproof jackets."
    />
    <title>Rainy Days | Home</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <div class="main"></div>
      <nav class="navigation">
        <a href="index.html"
          ><img
            src="images/rainy-days-logo.png"
            alt="rainy-days-logo"
            class="logo"
        /></a>
        <div class="genders">
          <a href="men.html" class="men">Men</a>
          <a href="women.html" class="women">Women</a>
        </div>
        <div class="navicons">
          <div class="searchfunction">
            <input type="checkbox" id="checkboxsearch" />
            <input type="search" id="searchbox" />
            <label for="checkboxsearch" class="searchicon"
              ><i class="fa-solid fa-magnifying-glass"></i
            ></label>
          </div>
          <a href="favourites.html" class="heart" title="favourites">
            <i class="fa-regular fa-heart"></i>
          </a>
          <a href="cart.html">
            <img
              src="images/shopping-cart.svg"
              alt="Shopping cart"
              class="cart"
            />
          </a>
        </div>
      </nav>
      <div class="breadcrumbs">
        <a href="index.html">Home</a>
        <span>/</span>
        <a href="women.html">Women</a>
      </div>
    </header>
    <main class="main-product">
      <div class="jacket-container">
        <img
          src="images/yellow-hiking.jpg"
          alt="Go hiking - Waterproof jacket"
          class="waterproof-jacket"
        />
        <div class="rest">
          <div class="details-text">
            <p>RAINY DAYS</p>
            <p>Go hiking - Waterproof jacket</p>
          </div>
          <div class="size-selector">
            <label for="size">Select size</label>
            <select name="size" id="size">
              <option value="xs">XS</option>
              <option value="s">S</option>
              <option value="m">M</option>
              <option value="l">L</option>
              <option value="xl">XL</option>
            </select>
          </div>
          <div class="cart-favourite">
            <a href="cart.html" class="shop-button-small">ADD TO CART</a>
            <a href="favourites.html" class="heart" title="favourites">
              <i class="fa-regular fa-heart white-heart"></i>
            </a>
          </div>
        </div>
      </div>
    </main>
    <footer>
      <section class="footer-nav">
        <a href="help.html" class="footer-links">Help</a>
        <a href="shipment.html" class="footer-links">Shipment</a>
        <a href="about-us.html" class="footer-links">About us</a>
        <a href="language.html" class="footer-links">Language</a>
      </section>
    </footer>
  </body>
</html>
